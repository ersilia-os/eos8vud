Status: Ready
Title: SQUID 3D shape generation
Description: Generates ten molecules matching the three-dimensional shape of a 
  reference compound while allowing the chemistry to change, the essence of 
  ligand-based scaffold hopping. SQUID, from Adams and Coley, uses an 
  equivariant network so that generation respects rotation and translation, 
  conditioning on shape rather than on the molecular graph. Because sampling is 
  stochastic and shape is matched approximately, outputs vary between runs and 
  still require assessment for synthetic feasibility.
