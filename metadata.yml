Identifier: eos8vud
Slug: squid
Status: In progress
Title: SQUID 3D shape generation
Description: |
  Equivariant shape-conditioned generation of 3D molecules for ligand-based drug design.
  SQUID can generate chemically diverse molecules for arbitrary molecular shapes.
  Shape is defined by the input molecule.
Mode: Pretrained
Task: Generative
Source: Local
Source Type: External
Input:
  - Compound
Input Dimension: 1
Output:
  - Compound
Output Dimension: 10
Output Consistency: Variable
Interpretation: Molecules matching the 3D shape of the input compound are suggested
Tag:
  - Compound Generation
Biomedical Area:
  - Any
Target Organism:
  - Any
Publication: https://arxiv.org/abs/2210.04893
Source Code: https://github.com/keiradams/SQUID
License: MIT
S3: https://ersilia-models-zipped.s3.eu-central-1.amazonaws.com/eos8vud.zip
DockerHub: https://hub.docker.com/r/ersiliaos/eos8vud
Docker Architecture:
  - AMD64
Release: v1.0.0
